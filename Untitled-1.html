<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ملعبي — المباريات</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f1f5f9; color: #1e293b; }
 
  /* ===== HEADER ===== */
  .site-header {
    background: linear-gradient(135deg, #0a3d1f, #1a6e3a);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .site-header h1 { color: #fff; font-size: 20px; font-weight: 500; }
  .logo { font-size: 24px; }
 
  /* ===== TOP BAR ===== */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 1.5rem;
    background: #fff;
    border-bottom: 1px solid #e2e8f0;
    flex-wrap: wrap;
    gap: 10px;
  }
  .filter-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
  .tab {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid #cbd5e1;
    background: transparent;
    color: #64748b;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all .15s;
  }
  .tab.active, .tab:hover { background: #1a6e3a; color: #fff; border-color: #1a6e3a; }
 
  /* ===== MATCHES GRID ===== */
  .matches-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    padding: 1.5rem;
  }
 
  /* ===== MATCH CARD ===== */
  .match-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    overflow: hidden;
    transition: transform .15s;
    cursor: pointer;
  }
  .match-card:hover { transform: translateY(-2px); }
 
  .card-league {
    background: #0a3d1f;
    color: #a8d8b0;
    font-size: 11px;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    display: inline-block;
    margin-left: 5px;
  }
  .status-dot.live { background: #e24b4a; animation: blink 1s infinite; }
  .status-dot.upcoming { background: #f0c040; }
  .status-dot.ended { background: #94a3b8; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
 
  .card-body { padding: 16px; }
  .teams {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .team { text-align: center; flex: 1; }
  .team-flag { font-size: 28px; display: block; margin-bottom: 4px; }
  .team-name { font-size: 12px; color: #64748b; font-weight: 500; }
  .vs-block { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .vs { font-size: 11px; color: #94a3b8; }
  .score { font-size: 22px; font-weight: 600; }
 
  .card-footer {
    border-top: 1px solid #f1f5f9;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .match-time { font-size: 12px; color: #64748b; }
 
  .watch-btn {
    padding: 5px 14px;
    border-radius: 8px;
    border: none;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    font-weight: 500;
  }
  .watch-btn.live { background: #e24b4a; color: #fff; }
  .watch-btn.upcoming { background: #1a6e3a; color: #fff; }
  .watch-btn.ended { background: #f1f5f9; color: #94a3b8; cursor: default; }
 
  /* ===== NEWS SECTION ===== */
  .news-section { padding: 0 1.5rem 2rem; }
  .news-section h2 {
    font-size: 16px;
    font-weight: 600;
    color: #1e293b;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .news-section h2::after {
    content: '';
    flex: 1;
    height: 1px;
    background: #e2e8f0;
  }
  .news-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .news-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    overflow: hidden;
    transition: transform .15s;
  }
  .news-card:hover { transform: translateY(-2px); }
  .news-card a { text-decoration: none; color: inherit; display: block; }
  .news-img {
    width: 100%;
    height: 140px;
    object-fit: cover;
    display: block;
    background: #e2e8f0;
    font-size: 40px;
    text-align: center;
    line-height: 140px;
  }
  .news-body { padding: 12px; }
  .news-tag {
    display: inline-block;
    background: #dcfce7;
    color: #166534;
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 20px;
    margin-bottom: 6px;
  }
  .news-title {
    font-size: 13px;
    font-weight: 600;
    color: #1e293b;
    line-height: 1.5;
    margin-bottom: 6px;
  }
  .news-meta { font-size: 11px; color: #94a3b8; }
</style>
</head>
<body>
 
<header class="site-header">
  <span class="logo">⚽</span>
  <h1>ملعبي — المباريات المباشرة</h1>
</header>
 
<div class="top-bar">
  <div class="filter-tabs">
    <button class="tab active" onclick="filterMatches('all', this)">الكل</button>
    <button class="tab" onclick="filterMatches('live', this)">مباشر</button>
    <button class="tab" onclick="filterMatches('upcoming', this)">قادمة</button>
    <button class="tab" onclick="filterMatches('ended', this)">منتهية</button>
  </div>
</div>
 
<div class="matches-grid" id="matchesGrid"></div>
 
<!-- ===== قسم الأخبار ===== -->
<section class="news-section">
  <h2>📰 آخر الأخبار</h2>
  <div class="news-grid" id="newsGrid"></div>
</section>
 
<script>
  /* ============================================================
     بيانات المباريات — عدّل هنا براحتك
     ============================================================
     كل مباراة عبارة عن object فيه:
       league      : اسم البطولة
       leagueIcon  : إيموجي البطولة
       team1       : اسم الفريق الأول
       flag1       : إيموجي / علم الفريق الأول
       team2       : اسم الفريق الثاني
       flag2       : إيموجي / علم الفريق الثاني
       score       : النتيجة (أو "- vs -" لو لسه ما بدأتش)
       time        : التوقيت أو الدقيقة اللي المباراة فيها (مثلاً "21:00" أو "75'")
       status      : الحالة — "live" أو "upcoming" أو "ended"
       link        : رابط موقع البث — لو مفيش خليه ""
     ============================================================ */
  const matches = [
    {
      league: "دوري أبطال أوروبا",
      leagueIcon: "🏆",
      team1: "ريال مدريد",
      flag1: "🇪🇸",
      team2: "مانشستر سيتي",
      flag2: "🏴󠁧󠁢󠁥󠁮󠁧󠁿",
      score: "vs",
      time: "75'",
      status: "live",
      link: "https://example.com/watch"   // ← حط رابط البث هنا
    },
    {
      league: "الدوري المصري",
      leagueIcon: "🇪🇬",
      team1: "الأهلي",
      flag1: "",
      team2: "الزمالك",
      flag2: "",
      score: "- vs -",
      time: "21:00",
      status: "upcoming",
      link: "https://example.com/ahly-zamalek"
    },
    {
      league: "الدوري الإنجليزي",
      leagueIcon: "🏴󠁧󠁢󠁥󠁮󠁧󠁿",
      team1: "ليفربول",
      flag1: "",
      team2: "أرسنال",
      flag2: "",
      score: "3 - 2",
      time: "انتهت",
      status: "ended",
      link: ""
    },
    {
      league: "الدوري الإسباني",
      leagueIcon: "🇪🇸",
      team1: "برشلونة",
      flag1: "🔵",
      team2: "أتلتيكو مدريد",
      flag2: "🔴",
      score: "- vs -",
      time: "22:00",
      status: "upcoming",
      link: ""
    },
  ];
  /* ============================================================
     نهاية البيانات
     ============================================================ */
 
 
  let currentFilter = "all";
 
  function filterMatches(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    btn.classList.add('active');
    renderMatches();
  }
 
  function renderMatches() {
    const grid = document.getElementById('matchesGrid');
    const filtered = currentFilter === 'all'
      ? matches
      : matches.filter(m => m.status === currentFilter);
 
    if (!filtered.length) {
      grid.innerHTML = '<p style="padding:2rem;color:#94a3b8">لا توجد مباريات</p>';
      return;
    }
 
    grid.innerHTML = filtered.map(m => {
      const statusLabel = m.status === 'live' ? 'مباشر' : m.status === 'upcoming' ? 'قادم' : 'منتهية';
      let btnHTML = '';
      if (m.status === 'ended') {
        btnHTML = `<button class="watch-btn ended" disabled>انتهت</button>`;
      } else if (m.link) {
        const label = m.status === 'live' ? '▶ شاهد الآن' : '🔔 تذكير';
        btnHTML = `<button class="watch-btn ${m.status}" onclick="window.open('${m.link}','_blank')">${label}</button>`;
      } else {
        btnHTML = `<button class="watch-btn upcoming" style="background:#94a3b8" disabled>لا يوجد رابط</button>`;
      }
 
      return `
        <div class="match-card">
          <div class="card-league">
            <span>${m.leagueIcon} ${m.league}</span>
            <span><span class="status-dot ${m.status}"></span>${statusLabel}</span>
          </div>
          <div class="card-body">
            <div class="teams">
              <div class="team">
                <span class="team-flag">${m.flag1}</span>
                <span class="team-name">${m.team1}</span>
              </div>
              <div class="vs-block">
                <span class="vs">VS</span>
                <span class="score">${m.score}</span>
              </div>
              <div class="team">
                <span class="team-flag">${m.flag2}</span>
                <span class="team-name">${m.team2}</span>
              </div>
            </div>
          </div>
          <div class="card-footer">
            <span class="match-time">⏱ ${m.time}</span>
            ${btnHTML}
          </div>
        </div>
      `;
    }).join('');
  }
 
  renderMatches();
 
  /* ============================================================
     بيانات الأخبار — عدّل هنا براحتك
     ============================================================
     كل خبر فيه:
       tag   : التصنيف (مثلاً "تشيلسي" أو "ميركاتو")
       title : عنوان الخبر
       date  : التاريخ أو الوقت
       img   : إيموجي بيظهر بدل الصورة — أو حط رابط صورة في خاصية src جوه الكود
       link  : الرابط اللي بيروح له لما تضغط على الخبر — لو مفيش خليه "#"
     ============================================================ */
  const news = [
    {
      tag: "ميركاتو",
      title: "ريال مدريد يقترب من ضم نجم مانشستر سيتي في صفقة تاريخية",
      date: "منذ ساعتين",
      img: "",
      link: "#"
    },
    
    {
      tag: "دوري أبطال أوروبا",
      title: "برشلونة يتعثر ويخسر فرصة التأهل المبكر لدور الـ 16",
      date: "أمس",
      img: "🏆",
      link: "#"
    },
    {
      tag: "إصابات",
      title: "غياب مبابي عن مباريات باريس القادمة بسبب إصابة في الركبة",
      date: "أمس",
      img: "🏥",
      link: "#"
    },
    {
      tag: "الدوري الإنجليزي",
      title: "مانشستر يونايتد يتعاقد مع مدرب جديد بعد سلسلة النتائج السلبية",
      date: "منذ يومين",
      img: "🏴󠁧󠁢󠁥󠁮󠁧󠁿",
      link: "#"
    },
    {
      tag: "منتخبات",
      title: "مصر تحقق فوزاً ثميناً في تصفيات كأس العالم وتقترب من التأهل",
      date: "منذ يومين",
      img: "🇪🇬",
      link: "#"
    },
  ];
  /* ============================================================
     نهاية بيانات الأخبار
     ============================================================ */
 
  function renderNews() {
    const grid = document.getElementById('newsGrid');
    grid.innerHTML = news.map(n => `
      <div class="news-card">
        <a href="${n.link}" target="_blank">
          <div class="news-img">${n.img}</div>
          <div class="news-body">
            <span class="news-tag">${n.tag}</span>
            <p class="news-title">${n.title}</p>
            <span class="news-meta">🕒 ${n.date}</span>
          </div>
        </a>
      </div>
    `).join('');
  }
 
  renderNews();
</script>
</body>
</html>
